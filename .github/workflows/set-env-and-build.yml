name: Build (write env from secrets)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create env file from repository secrets
        run: |
          echo "Creating .env.production from repo secrets"
          cat > .env.production <<EOF
          VITE_BOOK_ID=${{ secrets.VITE_BOOK_ID }}
          VITE_GOOGLE_FILE_ID=${{ secrets.VITE_GOOGLE_FILE_ID }}
          VITE_GOOGLE_API_KEY=${{ secrets.VITE_GOOGLE_API_KEY }}
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist
